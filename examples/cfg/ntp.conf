# /etc/ntp.conf, configuration for ntpd; see ntp.conf(5) for help

driftfile /var/lib/ntp/ntp.drift

# Enable statistics gathering
statsdir /var/log/ntpstats/
statistics loopstats
filegen loopstats file loopstats type day enable

# Network settings
restrict -4 default limited kod nomodify notrap nopeer
# Local users may interrogate the ntp server more closely.
restrict 127.0.0.1

# GPS Serial data reference (NTP0) gpsd shm
# This is the date/time source
server 127.127.28.0  minpoll 4 maxpoll 4 nopeer
fudge 127.127.28.0 time1 0.0 refid GPS

# GPS PPS reference (NTP1) gpsd shm
# This PPS should come from the DCD signal of the
# Xilinx uartps1 serial port but it does not seem to work
server 127.127.28.1 minpoll 4 maxpoll 4
fudge 127.127.28.1 refid PPS
